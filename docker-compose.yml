services:
  postgres:
    image: postgres:17-alpine
    container_name: mobil-legend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mobil_legend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - mobil_legend_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mobil_legend"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mobil_legend_postgres: